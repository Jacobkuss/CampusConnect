
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CampusConnect | Weather</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">CampusConnect</a>
            <div class="navbar-nav">
                <a class="nav-link" href="index.html">Home</a>
                <a class="nav-link" href="events.html">Events</a>
                <a class="nav-link active" href="weather.html">Weather</a>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <h1>Campus Weather</h1>
        <p>Current weather for Newberry, South Carolina.</p>

        <div class="card p-4 mt-4">
            <h2>Current Conditions</h2>
            <p id="weatherStatus">Loading weather data...</p>
            <h3 id="temperature">-- °F</h3>
            <p id="conditions">Please wait...</p>
            <p id="wind">Wind: -- mph</p>
            <button class="btn btn-primary" onclick="getWeather()">
                Refresh Weather
            </button>
        </div>
    </main>

    <footer class="text-center p-3 mt-5">
        <p>CampusConnect &copy; 2026</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
